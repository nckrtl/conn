name: Conn Server checks

# apps/conn-server/tools/check.sh: every Conn Server check that needs no model and no
# TypeScript. The comparisons against the T3 server are the audit kit (tools/audit.sh), which
# the audit-t3-providers skill runs; CI never does.

on:
  # Every PR starts the workflow; the `changes` job decides from the full diff
  # (.github/scripts/conn-server-checks-paths.cjs) whether the checks run. GitHub's `paths`
  # filter sees only the first 3,000 changed files, and a skipped run would report nothing.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cold:
        description: Skip Rust cache restore for a cold measurement
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conn-server-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same as `channel` in apps/conn-server/rust-toolchain.toml; tools/check.sh fails when they differ.
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "26.13.1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    name: Conn Server changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      # A pull request checks out GitHub's merge commit with fetch-depth: 2, so its first
      # parent is the base branch and the diff is the PR's change.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          sparse-checkout: |
            /.github/scripts/conn-server-checks-paths.cjs
            /.github/scripts/conn-server-checks-paths.test.cjs
            /.github/workflows/conn-server-checks.yml
            /apps/conn-server/tools/check.sh
          sparse-checkout-cone-mode: false

      - name: Test the selector
        if: github.event_name == 'pull_request'
        run: node --test .github/scripts/conn-server-checks-paths.test.cjs

      # Fails open: when the diff cannot be resolved, the checks run.
      - name: Detect
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          run_all() {
            echo "$* Running the checks."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            *) run_all "A ${EVENT_NAME} run always checks." ;;
          esac
          git diff -z --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-paths" \
            || run_all "Could not diff against ${base}."
          node .github/scripts/conn-server-checks-paths.cjs "$RUNNER_TEMP/changed-paths" > "$RUNNER_TEMP/run" \
            || run_all "Could not select."
          cat "$RUNNER_TEMP/run" >> "$GITHUB_OUTPUT"

  check:
    name: Conn Server ${{ matrix.group }} checks
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [rust, flows]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # rustfmt reads the root rustfmt.toml; tools/check.sh reads the workflows' toolchain pin.
          sparse-checkout: |
            /rustfmt.toml
            /.github/workflows/conn-server-checks.yml
            /.github/workflows/conn-server-ci.yml
            /.github/workflows/conn-server-release.yml
            /apps/conn-server/
          sparse-checkout-cone-mode: false

      # The canary, the sealed cargo runner and the flows run on Node.
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # instances-flow runs the real Agent SDK in the SDK host.
      - name: Install the SDK host
        if: matrix.group == 'flows'
        working-directory: apps/conn-server/helpers/sdk-host
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Restore Cargo
        if: ${{ !inputs.cold }}
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: conn-server-${{ matrix.group }}-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('apps/conn-server/Cargo.lock') }}
          restore-keys: conn-server-${{ matrix.group }}-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Install cargo-deny
        if: matrix.group == 'rust'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Checks
        working-directory: apps/conn-server
        env:
          GROUP: ${{ matrix.group }}
        run: |
          if [ "$GROUP" = flows ]; then
            # The flows need release semantics, not size optimization of every example.
            # conn-server-ci.yml still builds the production musl profile without these.
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=0 CARGO_PROFILE_RELEASE_LTO=false \
              CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          tools/check.sh --group "$GROUP"

      - name: Save Cargo on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/conn-server/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Reports on every run, so a change the checks do not read passes instead of waiting.
  checks:
    name: Conn Server checks
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every group
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          CHECK: ${{ needs.check.result }}
        run: |
          test "$CHANGES" = success || exit 1
          if [ "$RUN" = false ]; then echo "No file the checks read changed."; exit 0; fi
          test "$CHECK" = success
