[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [".refs", "vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"

[workspace.dependencies]
# Local workspace crates; the shared GPUI-free core lives in the repo-root crates/ workspace.
conn-client = { path = "../../crates/conn-client" }
conn-desktop = { path = "crates/conn-desktop" }
conn-orbit = { path = "../../crates/conn-orbit" }
conn-state = { path = "../../crates/conn-state" }
conn-theme = { path = "../../crates/conn-theme" }
conn-web = { path = "crates/conn-web" }

# Shared wire and contract crates from the sibling conn-server app in this monorepo.
conn-wire = { path = "../conn-server/crates/conn-wire" }
conn-contract = { path = "../conn-server/crates/conn-contract" }
# Typed Orbit Gateway operations generated from OpenAPI (nckrtl/conn#227); no crate uses it yet.
conn-gateway-api = { path = "../conn-server/crates/conn-gateway-api" }

# GPUI + UI component kit (pinned to match .refs/threadbear/desktop/gpui/Cargo.toml)
# Note: if macOS polish patches are needed, vendor into vendor/ and add [patch.crates-io]
# following .refs/threadbear/desktop/Cargo.toml.
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
rust-embed = { version = "=8.11.0", features = ["debug-embed"] }
markdown = "=1.0.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
alacritty_terminal = { version = "=0.26.0", default-features = false }
raw-window-handle = "=0.6.2"

# Async, networking, serialization, errors
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "=3.27.0"
thiserror = "2"
futures = "=0.3.34"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-tungstenite = "0.29"
tracing = "=0.1.44"
url = "2"

# Embedded Chromium (CEF-on-demand, feature-gated in conn-web; pinned to match .refs/threadbear)
bzip2 = "=0.6.1"
cc = "=1.11.3"
cef = { version = "=156.4.0", default-features = false }
cef-dll-sys = { version = "=156.4.0", features = ["dox"] }
libc = "=0.2.191"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }

# BeautifulRust + Threadbear lint set.
# `unsafe_code` is forbidden per-crate in conn-client, conn-state, and conn-theme;
# conn-app (AppKit shims) and conn-web (CEF FFI) require `// SAFETY:` on every block.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_mutex = "deny"
redundant_clone = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic_in_result_fn = "warn"
string_add = "warn"
missing_assert_message = "warn"
rc_buffer = "warn"
large_futures = "warn"
# GPUI callback types and enum variants follow Zed/Threadbear conventions.
type_complexity = "allow"
large_enum_variant = "allow"

[profile.dev]
# Keep GPUI + dependencies snappy while iterating on workspace crates.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
# Full debuginfo for every dependency made `target` grow past 140 GB. Line tables keep
# backtraces and file:line in the debugger; workspace crates keep full debuginfo.
debug = "line-tables-only"

# Optimize wire decoding and state reducers even in dev/hot-reload builds so large
# thread snapshots decode at full speed while conn-app stays opt-level = 0 for fast hot-patches.
[profile.dev.package.conn-client]
opt-level = 2

[profile.dev.package.conn-state]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true

[patch.crates-io]
# gpui-pre-macos 0.3.11 as published, plus Threadbear's patch (vendor/gpui-pre-macos/src/window.rs,
# another_view_has_the_keyboard): with a native view holding the keyboard (an embedded web page),
# keys without Cmd or Control go to that view rather than a hidden GPUI text box.
# conn-gpui also paces frames with CVDisplayLink instead of CAMetalDisplayLink (window.rs, at
# `metal_frames`): under the Metal link, frames drawn during key dispatch stayed off screen until
# the next mouse event (2026-11-21, reproduced in nick-vm). CONN_GPUI_METAL_DISPLAY_LINK=1 opts back in.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# gpui-pre-apple 0.3.11 as published, plus conn-gpui's variable-font weights
# (vendor/gpui-pre-apple/src/text_system.rs, `weight_variation`): GPUI picks the best-matching loaded
# face and never applies a variation axis, so a variable font drew at its default weight whatever
# was asked. A face with a `wght` axis now gets one CoreText variation per requested weight; static
# faces are untouched.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }

cpal = { git = "https://github.com/RustAudio/cpal", rev = "e1612d5d98152f8dc2a62e1b51ef7cbf4f7f26b7" }
# Unify `tree_sitter_language::LanguageFn` between crates.io grammar crates and
# the git tree-sitter above; two instances of the crate would make grammar
# constants type-incompatible with `tree_sitter::Language`.
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
livekit = { git = "https://github.com/zed-industries/livekit-rust-sdks", rev = "fbda05eb278b4a7c5be8fc9b2a92e9b62e732236" }
libwebrtc = { git = "https://github.com/zed-industries/livekit-rust-sdks", rev = "fbda05eb278b4a7c5be8fc9b2a92e9b62e732236" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
webrtc-sys = { git = "https://github.com/zed-industries/livekit-rust-sdks", rev = "fbda05eb278b4a7c5be8fc9b2a92e9b62e732236" }
# Avoid panicking when a failed EGL call reports EGL_SUCCESS.
# https://github.com/timothee-haudebourg/khronos-egl/pull/37
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
# Includes https://github.com/rust-minidump/minidump-writer/pull/249 to fix crashes on `cmd-q` (https://github.com/zed-industries/zed/issues/57664)
crash-context = { git = "https://github.com/rust-minidump/minidump-writer", rev = "911b04e09b79b736cc15cbe712e83e2d3f348bb9" }

# corgi runs build.rs/proc-macros in a sandbox with no write access outside the
# action's own OUT_DIR. Upstream `scratch` bakes its build-time OUT_DIR in via
# `env!` and hands every crate one shared directory, which the sandbox can't
# grant and a content-addressed build can't share. This patch reads OUT_DIR at
# runtime, so each build script gets a private, writable dir in its own entry —
# where cxx-build writes its shared cxxbridge headers. Kept local rather than a
# cxx git fork so Windows cargo builds are unaffected (a git checkout of cxx
# needs symlink support that Windows CI lacks). webrtc-sys is self-contained, so
# per-crate scratch dirs are sufficient. Upstream issue:
# https://github.com/dtolnay/cxx/issues/1752
scratch = { path = ".refs/zed-files-spike/tooling/corgi/patches/scratch" }


[profile.spike]
inherits = "dev"
debug = 0
incremental = false

[profile.spike.package."*"]
opt-level = 0
debug = 0

[profile.spike.package.sqlez_macros]
strip = "none"
debug = 1
