[package]
name = "conn-desktop"
description = "macOS desktop host services for conn-gpui (control socket, Operator dictation, Vault/Vaultwarden, server store, desktop Orbit storage)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
conn-orbit.workspace = true
conn-process.workspace = true
# Also trust the macOS system keychain: Orbit's root CA (the Gateway, `*.test` app hosts and
# local HTTPS services) lives there, as in Conn, which uses Chromium's network stack.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
url.workspace = true
uuid = { version = "=1.18.1", features = ["v4"] }
zeroize = { version = "=1.8.2", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "process", "io-util", "rt-multi-thread", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
# Used by `tests/missed_sigchld.rs` to block SIGCHLD before starting Tokio.
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[lints]
workspace = true

# Blocks SIGCHLD in `main` before any thread starts, so it needs its own process.
[[test]]
name = "missed_sigchld"
harness = false
