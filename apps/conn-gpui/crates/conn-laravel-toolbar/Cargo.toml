[package]
name = "conn-laravel-toolbar"
description = "GPUI-free Laravel Toolbar payload parser, store, feed, layout, SQL highlighter, and Orbit tool logic."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
conn-api-client.workspace = true
conn-orbit.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
