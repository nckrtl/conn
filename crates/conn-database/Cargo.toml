[package]
name = "conn-database"
description = "GPUI-free read-only database runner (MySQL/MariaDB, PostgreSQL, SQLite), SSH tunneling, and connection logic for Conn."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
conn-process.workspace = true
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "postgres", "sqlite-bundled", "json", "chrono", "uuid", "bigdecimal"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt-multi-thread", "macros"] }

[lints]
workspace = true
