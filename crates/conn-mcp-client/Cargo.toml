[package]
name = "conn-mcp-client"
description = "GPUI-free MCP client (stdio, Streamable HTTP, SSE), server store, and result helpers for Conn."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
conn-process.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["process", "io-util"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe `killpg` for stopping a stdio MCP server's whole process group.
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util", "rt-multi-thread", "macros"] }

[lints]
workspace = true
